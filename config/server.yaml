models:
  ephod:
    repo: ../src/Enzora_Screening/EpHod
    python: python3
    weights_dir: ../model_weights/enzora_screen/EpHod
  phenom:
    repo: ../src/Enzora_Screening/PheNom
    python: python3
    model_dir: ../model_weights/enzora_screen/PheNom
    esmc_model_dir: ../model_weights/enzora_screen/ESMC
    molt5_model_dir: ../model_weights/enzora_screen/MolT5
  unistab:
    repo: ../src/Enzora_Screening/UniStab
    python: python3
    checkpoint: ../model_weights/enzora_screen/UniStab/model.ckpt
    weights_dir: ../model_weights/enzora_screen/UniStab
llm:
  provider: minimax
  enabled: false
  base_url: https://api.minimax.cn/v1
  parameter_parsing: true
  auto_balance: true
  result_analysis: true
  parameter_model: MiniMax-M2.5
  analysis_model: MiniMax-M2.5
  max_tokens: 8192
  analysis_top_n: 20
  analysis_fail_open: true
# Administrator-only execution settings; RunSubmit cannot override this section.
execution:
  backend: local  # Set to slurm on the cluster after validating account/resources.
  slurm:
    account: bi46
    partition: fit
    cpus_per_task: 8
    memory: 64G
    gpu_resource: gpu:1
    qos: null
    constraint: null
    poll_seconds: 5
    command_timeout_seconds: 15
    monitor_failure_limit: 6
    queue_timeout_seconds: 86400
    # Optional administrator shell commands, e.g. module loads. Never place secrets here.
    setup_commands: []
runtime:
  gpu_id: 0
  timeout_seconds: 7200
  keep_temp: false  # Remove per-run tensors after completion, failure or confirmed cancellation.
  cache_dir: ../src/Enzora_Software_Cache/models
  max_gpu_jobs: 1
  max_cpu_jobs: 2
  phase_control: true
report:
  language: zh
mutation:
  config: mutation.yaml
  python: python3
  structure_path: ../src/Enzora_Software_Cache/inputs/enzyme.cif
  chain_id: A
  counts:
    1: 1000
  random_seed: 20260828
activity:
  task: kcat
  ligand_smiles: null
candidate:
  top_k: 1000
  allowed_positions: null
  excluded_positions: []
selection:
  # Native-unit resolution floors; freeze empirical scales after the first scoring pass.
  score_policy:
    method: input_reference_three_model_llm_v3
    calibration: first_pool_q10_q90
    resolution_scales: {kcat: 0.25, ph: 0.08, stability: 0.1}
  target_ph: 7.5
  ph_tolerance: 1.0
  stability_direction: lower_is_better
  stability_operator: none
  stability_threshold: null
  weights:
    ph: 0.3
    activity: 0.4
    stability: 0.3
  top_k: 5
  min_activity_log10: null
  confidence:
    ph: 1.0
    activity: 1.0
    stability: 1.0
visualization:
  enabled: true
  umap: true
plugin_roots:
- ../src/Enzora_Software_Webs/utils/plugins
jobs_dir: ../src/Enzora_Software_Cache/runs/web
cors_origins:
- http://localhost:5173
- http://127.0.0.1:5173
- https://yuzhangli2281.github.io
