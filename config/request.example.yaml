sequence_name: my_enzyme
sequence: MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM
user_request: null
output_dir: ../src/Enzora_Software_Cache/runs/cli
candidate:
  top_k: 1000
  allowed_positions: null
  excluded_positions: []
models:
  ephod:
    repo: ../src/Enzora_Screening/EpHod
    python: python3
    weights_dir: ../model_weights/enzora_screen/EpHod
  phenom:
    repo: ../src/Enzora_Screening/PheNom
    python: python3
    model_dir: ../model_weights/enzora_screen/PheNom
    esmc_model_dir: ../model_weights/enzora_screen/ESMC
    molt5_model_dir: ../model_weights/enzora_screen/MolT5
  unistab:
    repo: ../src/Enzora_Screening/UniStab
    python: python3
    checkpoint: ../model_weights/enzora_screen/UniStab/model.ckpt
    weights_dir: ../model_weights/enzora_screen/UniStab
selection:
  # Native-unit resolution floors; freeze empirical scales after the first scoring pass.
  score_policy:
    method: input_reference_three_model_llm_v3
    calibration: first_pool_q10_q90
    resolution_scales: {kcat: 0.25, ph: 0.08, stability: 0.1}
  target_ph: 7.5
  ph_tolerance: 1.0
  stability_direction: lower_is_better
  stability_operator: none
  stability_threshold: null
  weights:
    ph: 0.3
    activity: 0.4
    stability: 0.3
  top_k: 5
  min_activity_log10: null
  confidence:
    ph: 1.0
    activity: 1.0
    stability: 1.0
llm:
  provider: minimax
  enabled: false
  base_url: https://api.minimax.cn/v1
  parameter_parsing: true
  auto_balance: true
  result_analysis: true
  parameter_model: MiniMax-M2.5
  analysis_model: MiniMax-M2.5
  max_tokens: 8192
  analysis_top_n: 20
  analysis_fail_open: true
visualization:
  enabled: true
  umap: true
runtime:
  gpu_id: 0
  timeout_seconds: 7200
  keep_temp: false
  cache_dir: ../src/Enzora_Software_Cache/models
  phase_control: false
report:
  language: zh
mutation:
  config: mutation.yaml
  python: python3
  structure_path: ../src/Enzora_Software_Cache/inputs/enzyme.cif
  chain_id: A
  counts:
    1: 1000
  random_seed: 20260828
activity:
  task: kcat
  ligand_smiles: CCO
