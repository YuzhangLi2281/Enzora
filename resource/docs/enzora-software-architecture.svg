</svg><text x="207" y="391" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#20333D">Browser workspace</text><text x="390" y="218" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#20333D">Library → Screening → Output</text><text x="390" y="264" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#4B606D">Review input and inspect results</text><text x="390" y="309" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#4B606D">Explicit buttons start computation</text><path d="M805 275H932" fill="none" stroke="#4D83C4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="971" y="190" width="470" height="165" rx="22" fill="#FFFFFF" stroke="#81BABC" stroke-width="2.5"/><text x="1206" y="233" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#20333D">Authenticated API</text><text x="1206" y="279" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#4B606D">Validated requests · live progress</text><text x="1206" y="320" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#4B606D">Persistent job state</text><path d="M1205 437V478" fill="none" stroke="#81BABC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><svg xmlns="http://www.w3.org/2000/svg" x="587" y="545" width="70" height="70" viewBox="0 0 64 64"><title id="systemlogo-enzora-logo-title">Enzora</title><desc id="systemlogo-enzora-logo-desc">A folded protein ribbon forms a flowing Z. One deep-blue segment marks a selected sequence residue.</desc><defs><linearGradient id="systemlogo-enzora-fold-top" x1="10" y1="13" x2="53" y2="31" gradientUnits="userSpaceOnUse"><stop stop-color="#83C6C6" /><stop offset=".5" stop-color="#9BCDD5" /><stop offset="1" stop-color="#9DB5DE" /></linearGradient><linearGradient id="systemlogo-enzora-fold-middle" x1="49" y1="22" x2="19" y2="47" gradientUnits="userSpaceOnUse"><stop stop-color="#85ACD9" /><stop offset=".47" stop-color="#A7B2DF" /><stop offset="1" stop-color="#B79BCD" /></linearGradient><linearGradient id="systemlogo-enzora-fold-bottom" x1="13" y1="42" x2="53" y2="52" gradientUnits="userSpaceOnUse"><stop stop-color="#B49AC8" /><stop offset=".58" stop-color="#C6AED5" /><stop offset="1" stop-color="#ADC7E0" /></linearGradient><linearGradient id="systemlogo-enzora-fold-light" x1="24" y1="11" x2="48" y2="47" gradientUnits="userSpaceOnUse"><stop stop-color="white" stop-opacity=".68" /><stop offset="1" stop-color="white" stop-opacity=".08" /></linearGradient></defs><metadata>Original Enzora mark. Abstract folded-ribbon Z and selected-residue accent. Conceptual protein-folding and sequence-design symbol, not a depiction of a specific molecular structure.</metadata><g id="systemlogo-folded-z-ribbon" transform="translate(-4 -5) scale(1.16)"><path d="M12 19C22 8 42 8 53 19L47 28C39 20 26 20 18 27Z" fill="url(#systemlogo-enzora-fold-top)" /><path d="M47 21L53 29 23 51 12 44Z" fill="url(#systemlogo-enzora-fold-middle)" /><path d="M12 41C23 49 40 48 49 39L54 47C43 59 23 59 12 48C10 46 10 43 12 41Z" fill="url(#systemlogo-enzora-fold-bottom)" /><path d="M15 19C24 11 40 11 49 19" stroke="white" stroke-opacity=".58" stroke-width="1.4" stroke-linecap="round" /><path d="M48 25L18 46" stroke="white" stroke-opacity=".32" stroke-width="1.1" stroke-linecap="round" /><path d="M15 44C25 52 41 51 50 44" stroke="white" stroke-opacity=".38" stroke-width="1.2" stroke-linecap="round" /><path d="M26 37.5L32.5 32.8 38 39.7 31.4 44.5Z" fill="#234B80" /><path d="M28 38L32.5 34.7" stroke="#A8CBE8" stroke-opacity=".85" stroke-width="1.15" stroke-linecap="round" /></g></svg><text x="675" y="591" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" text-anchor="start" fill="#20333D">Enzora Agent</text><svg xmlns="http://www.w3.org/2000/svg" x="695" y="618" width="182" height="101" viewBox="0 0 280 160"><defs><linearGradient id="systembalance-beam" x2="0" y2="1"><stop stop-color="#DDEBF0" /><stop offset="1" stop-color="#8BA8BD" /></linearGradient></defs><g stroke="#55697C" stroke-width="3.5" stroke-linejoin="round"><path d="M83 148h114l-16-12h-32V49h-20v87H99Z" fill="url(#systembalance-beam)" /><path d="M46 46Q140 17 234 46l-1 9Q141 37 47 55Z" fill="#B7A0D2" /><circle cx="140" cy="44" r="10" fill="#EEF5F9" /><path d="M49 52 18 112m31-60 31 60m151-60-31 60m31-60 31 60" fill="none" stroke-width="2.5" /><path d="M10 111h78q-7 24-39 24t-39-24Z" fill="#B9DEDD" /><path d="M192 111h78q-7 24-39 24t-39-24Z" fill="#EAC8DC" /></g><g fill="#7CB9BE"><circle cx="39" cy="101" r="9" /><circle cx="55" cy="101" r="9" /><circle cx="47" cy="87" r="9" /></g><g fill="#B59ACF"><circle cx="221" cy="100" r="10" /><circle cx="238" cy="101" r="10" /><circle cx="230" cy="84" r="10" /></g></svg><text x="135" y="609" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#20333D">Task + input summary</text><path d="M435 618C490 618 490 593 565 593" fill="none" stroke="#4D83C4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><text x="1100" y="609" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#20333D">Tool Registry</text><text x="1100" y="650" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#4B606D">Declared capabilities</text><path d="M947 593C1003 593 1001 618 1068 618" fill="none" stroke="#4D83C4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><rect x="122" y="779" width="380" height="100" rx="16" fill="#FFFFFF" stroke="#AE91C8" stroke-width="2.5"/><text x="312" y="817" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#20333D">ToolSpec</text><text x="312" y="853" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4B606D">Validate arguments</text><rect x="610" y="779" width="380" height="100" rx="16" fill="#FFFFFF" stroke="#81BABC" stroke-width="2.5"/><text x="800" y="817" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#20333D">BioArtifact</text><text x="800" y="853" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4B606D">Sequence + predictions + provenance</text><rect x="1098" y="779" width="380" height="100" rx="16" fill="#FFFFFF" stroke="#E8ACC9" stroke-width="2.5"/><text x="1288" y="817" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#20333D">Model adapters</text><text x="1288" y="853" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#4B606D">Prepare inputs · check outputs</text><path d="M800 720C800 744 312 725 312 762" fill="none" stroke="#AE91C8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><path d="M800 720V762" fill="none" stroke="#AE91C8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><path d="M800 720C800 744 1288 725 1288 762" fill="none" stroke="#AE91C8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/><path d="M800 924V963" fill="none" stroke="#4B606D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/><rect x="107" y="1080" width="375" height="112" rx="18" fill="#FFFFFF" stroke="#81BABC" stroke-width="2.5"/><text x="294.5" y="1123" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#20333D">VESM library</text><text x="294.5" y="1165" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#4B606D">Three-model mutation proposals</text><rect x="609" y="1080" width="375" height="112" rx="18" fill="#FFFFFF" stroke="#AE91C8" stroke-width="2.5"/><text x="796.5" y="1123" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#20333D">Property scorers</text><text x="796.5" y="1165" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#4B606D">PHENOM · EpHod · UniStab</text><rect x="1111" y="1080" width="375" height="112" rx="18" fill="#FFFFFF" stroke="#E8ACC9" stroke-width="2.5"/><text x="1298.5" y="1123" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#20333D">Candidate delivery</text><text x="1298.5" y="1165" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#4B606D">Top-K · UMAP · report · CDS</text><path d="M495 1135H587" fill="none" stroke="#4D83C4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><path d="M997 1135H1088" fill="none" stroke="#4D83C4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><text x="111" y="1280" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#20333D">Shared model resources</text><text x="111" y="1323" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#4B606D">Weights stay separate</text><text x="610" y="1280" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#20333D">Run-owned temporary files</text><text x="610" y="1323" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#4B606D">Clear reproducible features</text><text x="1109" y="1280" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#20333D">Retained outputs</text><text x="1109" y="1323" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#4B606D">Requests · scores · decisions</text><text x="110" y="1397" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#20333D">Selected sequences and saved evidence support the next design cycle.</text><text x="65" y="1510" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#4B606D">Execution remains in checked tools; the language model cannot silently advance the workflow.</text></svg>