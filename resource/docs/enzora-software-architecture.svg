<svg xmlns="http://www.w3.org/2000/svg" width="1890" height="880" viewBox="0 0 1890 880" role="img"><title>Enzora left-to-right software architecture</title><desc>Input and workspace pass through the authenticated API, persistent job/tool executor, model adapters and retained scientific results. The Agent control lane targets validated tools. Storage lifecycles are separated below. Future assay feedback is prospective.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#25343D"/></marker></defs><rect x="0" y="0" width="1890" height="880" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="55" y="64" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" text-anchor="start" fill="#25343D">One workspace. Checked tools. A traceable design cycle.</text><text x="55" y="105" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#5B6870">Enzora software architecture</text><text x="55" y="307" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#AE91C8">01</text><rect x="55" y="337" width="300" height="220" rx="16" fill="#FFFFFF" stroke="#C5CDD3" stroke-width="2"/><rect x="55" y="337" width="300" height="7" rx="0" fill="#81BABC" stroke="none" stroke-width="2"/><text x="75" y="385" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#25343D">Workspace</text><text x="75" y="433" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">Sequence + substrate</text><text x="75" y="467" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">Budget + objectives</text><text x="75" y="501" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">Explicit stage controls</text><path d="M367 449H410" fill="none" stroke="#25343D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="425" y="307" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#AE91C8">02</text><rect x="425" y="337" width="300" height="220" rx="16" fill="#FFFFFF" stroke="#C5CDD3" stroke-width="2"/><rect x="425" y="337" width="300" height="7" rx="0" fill="#93ACD1" stroke="none" stroke-width="2"/><text x="445" y="385" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#25343D">Authenticated API</text><text x="445" y="433" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">Check request contracts</text><text x="445" y="467" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">Protect model access</text><text x="445" y="501" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">Stream task progress</text><path d="M737 449H780" fill="none" stroke="#25343D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="795" y="307" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#AE91C8">03</text><rect x="795" y="337" width="300" height="220" rx="16" fill="#FFFFFF" stroke="#C5CDD3" stroke-width="2"/><rect x="795" y="337" width="300" height="7" rx="0" fill="#AE91C8" stroke="none" stroke-width="2"/><text x="815" y="385" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#25343D">Jobs + tool executor</text><text x="815" y="433" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">ToolSpec / Registry</text><text x="815" y="467" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">BioArtifact identity</text><text x="815" y="501" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">Persist state + decisions</text><path d="M1107 449H1150" fill="none" stroke="#25343D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1165" y="307" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#AE91C8">04</text><rect x="1165" y="337" width="300" height="220" rx="16" fill="#FFFFFF" stroke="#C5CDD3" stroke-width="2"/><rect x="1165" y="337" width="300" height="7" rx="0" fill="#E8ACC9" stroke="none" stroke-width="2"/><text x="1185" y="385" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#25343D">Model adapters</text><text x="1185" y="433" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">VESM · three generators</text><text x="1185" y="467" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">PHENOM · EpHod · UniStab</text><text x="1185" y="501" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">Atlas / sequence tools</text><path d="M1477 449H1520" fill="none" stroke="#25343D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1535" y="307" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#AE91C8">05</text><rect x="1535" y="337" width="300" height="220" rx="16" fill="#FFFFFF" stroke="#C5CDD3" stroke-width="2"/><rect x="1535" y="337" width="300" height="7" rx="0" fill="#93ACD1" stroke="none" stroke-width="2"/><text x="1555" y="385" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#25343D">Results + next input</text><text x="1555" y="433" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">Top-K · UMAP · report</text><text x="1555" y="467" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">FASTA / CSV / JSON</text><text x="1555" y="501" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">Optional coding DNA</text><rect x="804" y="151" width="632" height="111" rx="14" fill="#EDE7F5" stroke="none" stroke-width="2"/><text x="829" y="191" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#25343D">Enzora Assistant</text><text x="829" y="231" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#5B6870">Task + evidence → validated tool arguments</text><path d="M950 275V322" fill="none" stroke="#25343D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="60" y="212" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#5B6870">INPUT + USER CONTROL</text><text x="1545" y="212" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#5B6870">RETAINED OUTPUT</text><path d="M1685 579V628H205V578" fill="none" stroke="#AE91C8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M205 628V578" fill="none" stroke="#25343D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="945" y="618" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#AE91C8">Reuse a selected sequence + new evidence in the next design cycle</text><rect x="55" y="674" width="1780" height="121" rx="16" fill="#EDF5F8" stroke="none" stroke-width="2"/><text x="80" y="718" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#25343D">Shared model resources</text><text x="80" y="758" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#5B6870">Reusable weights and environments</text><text x="670" y="718" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#25343D">Run-owned temporary features</text><text x="670" y="758" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#5B6870">Clean up after termination</text><text x="1260" y="718" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#25343D">Retained scientific record</text><text x="1260" y="758" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#5B6870">Request · scores · policy · exports</text><text x="55" y="840" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#5B6870">Future lab-in-the-loop: measured assays can return as new evidence; repeated wet-lab rounds were not performed.</text></svg>