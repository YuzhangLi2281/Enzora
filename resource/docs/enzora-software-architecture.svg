<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="112.50mm" viewBox="0 0 1600 1000" role="img"><title>Enzora software architecture</title><desc>The browser communicates with an authenticated API. A persistent job scheduler runs fixed stages, while typed tools expose validated operations to the Assistant.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="white" stroke="none" stroke-width="2" /><text x="55" y="81" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#20333D"><tspan x="55" dy="0">Enzora as a software system</tspan></text><text x="55" y="128" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#4B606D"><tspan x="55" dy="0">A stable execution path with typed tools, persistent results and live progress.</tspan></text><rect x="55" y="201" width="450" height="254" rx="12" fill="#F8FAFC" stroke="#81BABC" stroke-width="2" /><text x="77" y="254" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#20333D"><tspan x="77" dy="0">Browser workspace</tspan></text><text x="77" y="315" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#20333D"><tspan x="77" dy="0">Sequence input</tspan><tspan x="77" dy="35.0">Screening controls</tspan><tspan x="77" dy="35.0">Maps, reports and exports</tspan></text><rect x="575" y="201" width="450" height="254" rx="12" fill="#F8FAFC" stroke="#AE91C8" stroke-width="2" /><text x="597" y="254" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#20333D"><tspan x="597" dy="0">Authenticated API</tspan></text><text x="597" y="315" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#20333D"><tspan x="597" dy="0">Validated requests</tspan><tspan x="597" dy="35.0">Live progress over SSE</tspan><tspan x="597" dy="35.0">Session-scoped Assistant</tspan></text><rect x="1095" y="201" width="450" height="254" rx="12" fill="#F8FAFC" stroke="#E8ACC9" stroke-width="2" /><text x="1117" y="254" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#20333D"><tspan x="1117" dy="0">Job scheduler</tspan></text><text x="1117" y="315" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#20333D"><tspan x="1117" dy="0">Persisted stage state</tspan><tspan x="1117" dy="35.0">Explicit execution gates</tspan><tspan x="1117" dy="35.0">Independent model jobs</tspan></text><path d="M515,313.5h29.25v-5.5l15.749999999999998,11.0l-15.749999999999998,11.0v-5.5H515Z" fill="#4B606D" /><path d="M1035,313.5h29.25v-5.5l15.749999999999998,11.0l-15.749999999999998,11.0v-5.5H1035Z" fill="#4B606D" /><text x="55" y="544" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#20333D"><tspan x="55" dy="0">Data and tool contracts</tspan></text><text x="55" y="599" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#20333D"><tspan x="55" dy="0">BioArtifact keeps sequences, predictions</tspan><tspan x="55" dy="35.0">and provenance together.</tspan></text><text x="55" y="681" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#20333D"><tspan x="55" dy="0">ToolSpec and Tool Registry describe</tspan><tspan x="55" dy="35.0">supported capabilities.</tspan></text><text x="55" y="763" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#20333D"><tspan x="55" dy="0">Adapters prepare model inputs</tspan><tspan x="55" dy="35.0">and validate returned outputs.</tspan></text><rect x="835" y="510" width="710" height="302" rx="12" fill="#F2EDF8" stroke="none" stroke-width="2" /><text x="860" y="564" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#20333D"><tspan x="860" dy="0">Fixed computational stages</tspan></text><text x="860" y="623" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#20333D"><tspan x="860" dy="0">VESM library construction</tspan></text><path d="M884.75,641h9.5v18.2h4.75l-9.5,9.799999999999999l-9.5,-9.799999999999999h4.75Z" fill="#AE91C8" /><text x="918" y="677" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#20333D"><tspan x="918" dy="0">Phenom, EpHod and UniStab</tspan></text><path d="M884.75,695h9.5v18.2h4.75l-9.5,9.799999999999999l-9.5,-9.799999999999999h4.75Z" fill="#AE91C8" /><text x="918" y="735" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#20333D"><tspan x="918" dy="0">Scoring, Top-K, UMAP and reporting</tspan></text><path d="M1320,455L1320,503" stroke="#AE91C8" stroke-width="4" stroke-linecap="round" fill="none" /><rect x="55" y="863" width="1490" height="82" rx="12" fill="#EDF6F7" stroke="none" stroke-width="2" /><text x="80" y="906" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#20333D"><tspan x="80" dy="0">Shared model weights stay separate from each run. Temporary graphs and logits are cleared after completion.</tspan></text><text x="55" y="986" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#4B606D"><tspan x="55" dy="0">MiniMax requests tools through a bounded interface. The API validates parameters before changing a run.</tspan></text></svg>