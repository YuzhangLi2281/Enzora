<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1540" width="1600" height="1540" role="img"><title>Enzora software framework</title><desc>The workspace, authenticated API, bounded Agent tool calls and model stages share persistent input/output records. Model weights, temporary features and retained scientific outputs have distinct lifecycles. Native SVG components remain editable.</desc><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4D83C4"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#AE91C8"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#81BABC"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4B606D"/></marker></defs><rect x="0" y="0" width="1600" height="1540" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2.5"/><text x="65" y="65" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" text-anchor="start" fill="#20333D">Enzora as a software framework</text><rect x="45" y="105" width="1510" height="330" rx="42" fill="#EFF6F6" stroke="none" stroke-width="2.5"/><text x="1510" y="156" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" text-anchor="end" fill="#20333D">Workspace and execution</text><rect x="45" y="490" width="1510" height="430" rx="42" fill="#F1ECF8" stroke="none" stroke-width="2.5"/><text x="1510" y="541" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" text-anchor="end" fill="#20333D">Agent and tool contracts</text><rect x="45" y="975" width="1510" height="470" rx="42" fill="#DDE6F3" stroke="none" stroke-width="2.5"/><text x="1510" y="1026" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" text-anchor="end" fill="#20333D">Computation and retained evidence</text><svg xmlns="http://www.w3.org/2000/svg" x="100" y="208" width="205" height="155" viewBox="23 33 224 154"><title id="laptop-laptop-title">Laptop computer icon</title>
