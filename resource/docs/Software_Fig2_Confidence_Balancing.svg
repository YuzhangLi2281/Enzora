<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img"><title>Candidate-specific evidence calibration</title><desc>The original predictors remain unchanged. Run-level Agent policy and measured candidate uncertainty are distinct. N32A and V501A bars use actual saved output and sum to their recorded scores. No balance icon or simulated performance points.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#25343D"/></marker></defs><rect x="0" y="0" width="1600" height="1080" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="60" y="67" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="700" text-anchor="start" fill="#25343D">The Virtual Biologist</text><text x="60" y="110" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#5B6870">Let the evidence set the influence of each prediction.</text><rect x="52" y="157" width="735" height="405" rx="20" fill="#FFFFFF" stroke="#C5D7E4" stroke-width="2"/><text x="82" y="200" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#25343D">Prediction evidence</text><text x="82" y="240" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#5B6870">N32A · saved model outputs</text><text x="360" y="240" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#5B6870">Prediction</text><text x="587" y="240" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" text-anchor="start" fill="#5B6870">Uncertainty</text><rect x="82" y="272" width="9" height="48" rx="4" fill="#AE91C8" stroke="none" stroke-width="2"/><text x="109" y="300" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#AE91C8">PHENOM</text><text x="376" y="300" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#25343D">3.071</text><text x="600" y="300" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#25343D">1.870</text><path d="M82 335H751" fill="none" stroke="#DEE6EC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="82" y="366" width="9" height="48" rx="4" fill="#81BABC" stroke="none" stroke-width="2"/><text x="109" y="394" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#81BABC">EpHod</text><text x="376" y="394" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#25343D">6.774</text><text x="600" y="394" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#25343D">0.108</text><path d="M82 429H751" fill="none" stroke="#DEE6EC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="82" y="460" width="9" height="48" rx="4" fill="#E8ACC9" stroke="none" stroke-width="2"/><text x="109" y="488" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="start" fill="#E8ACC9">UniStab</text><text x="376" y="488" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#25343D">0.008</text><text x="600" y="488" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#25343D">0.066</text><path d="M82 523H751" fill="none" stroke="#DEE6EC" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M810 359H884" fill="none" stroke="#25343D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="920" y="157" width="625" height="405" rx="24" fill="#EEF0FA" stroke="none" stroke-width="2"/><text x="952" y="205" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#25343D">Enzora Assistant</text><text x="952" y="247" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#5B6870">Reads the task goal and the available evidence.</text><text x="952" y="281" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#5B6870">Uses a checked tool to set the reliability policy.</text><rect x="950" y="344" width="563" height="111" rx="14" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="974" y="384" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#25343D">Goal + source-labelled uncertainty</text><text x="974" y="422" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#5B6870">Validated policy · saved explanation</text><text x="952" y="515" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#25343D">Original model predictions remain unchanged.</text><path d="M1235 578V616H802V645" fill="none" stroke="#25343D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="60" y="643" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#25343D">Each candidate receives its own evidence mixture</text><text x="60" y="680" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#5B6870">The scoring engine applies candidate-specific uncertainty under the accepted policy.</text><text x="60" y="757" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#25343D">N32A</text><text x="60" y="789" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">Score 0.512</text><rect x="260" y="733" width="55.44404922093891" height="40" rx="0" fill="#AE91C8" stroke="none" stroke-width="2"/><rect x="315.4440492209389" y="733" width="156.93462944646743" height="40" rx="0" fill="#81BABC" stroke="none" stroke-width="2"/><rect x="472.37867866740635" y="733" width="90.80418201875469" height="40" rx="0" fill="#E8ACC9" stroke="none" stroke-width="2"/><rect x="563.182860686161" y="733" width="301.45318790968287" height="40" rx="0" fill="#CFD5D7" stroke="none" stroke-width="2"/><text x="260" y="805" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#AE91C8">Activity influence 0.122</text><text x="610" y="805" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#81BABC">pH influence 0.209</text><text x="960" y="805" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#E8ACC9">Stability influence 0.158</text><text x="60" y="865" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#25343D">V501A</text><text x="60" y="897" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#5B6870">Score 0.512</text><rect x="260" y="841" width="78.40841236983773" height="40" rx="0" fill="#AE91C8" stroke="none" stroke-width="2"/><rect x="338.4084123698377" y="841" width="151.3953682193953" height="40" rx="0" fill="#81BABC" stroke="none" stroke-width="2"/><rect x="489.80378058923304" y="841" width="140.3098603391331" height="40" rx="0" fill="#E8ACC9" stroke="none" stroke-width="2"/><rect x="630.1136409283662" y="841" width="233.60273523852973" height="40" rx="0" fill="#CFD5D7" stroke="none" stroke-width="2"/><text x="260" y="913" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#AE91C8">Activity influence 0.123</text><text x="610" y="913" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#81BABC">pH influence 0.187</text><text x="960" y="913" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#E8ACC9">Stability influence 0.294</text><rect x="60" y="972" width="17" height="17" rx="2" fill="#AE91C8" stroke="none" stroke-width="2"/><text x="87" y="987" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#25343D">PHENOM evidence</text><rect x="443" y="972" width="17" height="17" rx="2" fill="#81BABC" stroke="none" stroke-width="2"/><text x="470" y="987" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#25343D">EpHod evidence</text><rect x="826" y="972" width="17" height="17" rx="2" fill="#E8ACC9" stroke="none" stroke-width="2"/><text x="853" y="987" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#25343D">UniStab evidence</text><rect x="1209" y="972" width="17" height="17" rx="2" fill="#CFD5D7" stroke="none" stroke-width="2"/><text x="1236" y="987" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#25343D">Uncertainty → 0.5</text><text x="60" y="1043" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#5B6870">Aim: stop an uncertain prediction dominating the shortlist. Confidence is not a guarantee of experimental success.</text></svg>