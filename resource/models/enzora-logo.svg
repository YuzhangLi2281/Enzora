<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-labelledby="enzora-logo-title enzora-logo-desc"><title id="enzora-logo-title">Enzora</title><desc id="enzora-logo-desc">A folded protein ribbon forms a flowing Z. One deep-blue segment marks a selected sequence residue.</desc><defs><linearGradient id="enzora-fold-top" x1="10" y1="13" x2="53" y2="31" gradientUnits="userSpaceOnUse"><stop stop-color="#83C6C6"/><stop offset=".5" stop-color="#9BCDD5"/><stop offset="1" stop-color="#9DB5DE"/></linearGradient><linearGradient id="enzora-fold-middle" x1="49" y1="22" x2="19" y2="47" gradientUnits="userSpaceOnUse"><stop stop-color="#85ACD9"/><stop offset=".47" stop-color="#A7B2DF"/><stop offset="1" stop-color="#B79BCD"/></linearGradient><linearGradient id="enzora-fold-bottom" x1="13" y1="42" x2="53" y2="52" gradientUnits="userSpaceOnUse"><stop stop-color="#B49AC8"/><stop offset=".58" stop-color="#C6AED5"/><stop offset="1" stop-color="#ADC7E0"/></linearGradient><linearGradient id="enzora-fold-light" x1="24" y1="11" x2="48" y2="47" gradientUnits="userSpaceOnUse"><stop stop-color="white" stop-opacity=".68"/><stop offset="1" stop-color="white" stop-opacity=".08"/></linearGradient></defs><metadata>Original Enzora mark. Abstract folded-ribbon Z and selected-residue accent. Conceptual protein-folding and sequence-design symbol, not a depiction of a specific molecular structure.</metadata><g id="folded-z-ribbon" transform="translate(-4 -5) scale(1.16)"><path d="M12 19C22 8 42 8 53 19L47 28C39 20 26 20 18 27Z" fill="url(#enzora-fold-top)"/><path d="M47 21L53 29 23 51 12 44Z" fill="url(#enzora-fold-middle)"/><path d="M12 41C23 49 40 48 49 39L54 47C43 59 23 59 12 48C10 46 10 43 12 41Z" fill="url(#enzora-fold-bottom)"/><path d="M15 19C24 11 40 11 49 19" stroke="white" stroke-opacity=".58" stroke-width="1.4" stroke-linecap="round"/><path d="M48 25L18 46" stroke="white" stroke-opacity=".32" stroke-width="1.1" stroke-linecap="round"/><path d="M15 44C25 52 41 51 50 44" stroke="white" stroke-opacity=".38" stroke-width="1.2" stroke-linecap="round"/><path d="M26 37.5L32.5 32.8 38 39.7 31.4 44.5Z" fill="#234B80"/><path d="M28 38L32.5 34.7" stroke="#A8CBE8" stroke-opacity=".85" stroke-width="1.15" stroke-linecap="round"/></g></svg>
